<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Administrator｜全球面試排程管理系統</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=28">
</head>
<body><div class="admin-shell d-flex">
  <aside class="sidebar d-flex flex-column"><a href="index.html" class="navbar-brand text-white fw-bold mb-4"><span class="brand-mark me-2">G</span>Interview OS</a><nav class="nav nav-pills flex-column sidebar-menu"><button class="nav-link text-start active"><i class="bi bi-person-gear me-2"></i>HR 帳號管理</button></nav><div class="mt-auto pt-4 border-top border-secondary-subtle"><div class="small text-white" data-user-name></div><div class="small text-secondary mb-2">Administrator</div><button class="btn btn-outline-light btn-sm w-100" data-logout><i class="bi bi-box-arrow-right me-1"></i>登出</button></div></aside>
  <main class="admin-main flex-grow-1 p-3 p-md-4 p-xl-5"><div class="workspace-bar"><div><span class="workspace-label">System Administration</span><strong>Administrator 控制台</strong></div></div><div id="alert"></div><header class="section-header"><div><p class="eyebrow">Access Management</p><h1 class="h2 fw-bold mb-1">HR 帳號管理</h1><p class="section-description">建立、更新或移除可使用面試排程系統的 HR 帳號。</p></div><button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#account-modal"><i class="bi bi-person-plus me-1"></i>新增 HR 帳號</button></header><div id="stats" class="row g-3 mb-4"></div><div class="panel"><div class="table-responsive"><table class="table mb-0"><thead><tr><th>HR 姓名</th><th>Username</th><th>Email</th><th>帳號狀態</th><th>建立日期</th><th class="text-end">操作</th></tr></thead><tbody id="accounts-table"></tbody></table></div></div></main>
</div>
<div class="modal fade" id="account-modal" tabindex="-1"><div class="modal-dialog"><form id="account-form" class="modal-content"><div class="modal-header"><div><p class="eyebrow mb-1">Account details</p><h2 id="modal-title" class="modal-title fs-5">新增 HR 帳號</h2></div><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button></div><div class="modal-body"><div id="form-alert"></div><input id="account-id" type="hidden"><div class="mb-3"><label class="form-label" for="name">姓名 *</label><input id="name" class="form-control" required></div><div class="mb-3"><label class="form-label" for="username">Username *</label><input id="username" class="form-control" minlength="3" required></div><div class="mb-3"><label class="form-label" for="email">Email（可選）</label><input id="email" class="form-control" type="email"></div><div><label class="form-label" for="password">Password <span id="password-hint" class="text-muted-app small"></span></label><input id="password" class="form-control" type="password" minlength="8"><div class="form-text">至少 8 個字元。</div></div></div><div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button><button class="btn btn-primary" type="submit">儲存帳號</button></div></form></div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js?v=25"></script><script src="js/admin.js?v=25"></script>
</body></html>
