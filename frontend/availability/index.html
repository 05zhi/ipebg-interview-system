<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="referrer" content="no-referrer">
  <title>填寫面試空檔｜iPEBG</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css?v=63">
</head>
<body class="public-page">
  <header class="public-nav"><a class="navbar-brand" href="/"><span class="brand-mark">G</span><span><strong>Interview OS</strong><small>Secure Availability</small></span></a></header>
  <main class="container py-4 py-md-5" style="max-width:900px">
    <section class="panel p-4 p-md-5">
      <p class="eyebrow mb-2">Interview availability</p>
      <h1 class="h2 mb-2" id="availability-title">正在驗證安全連結…</h1>
      <p class="text-muted-app" id="availability-summary">請稍候。</p>
      <div class="alert d-none" id="availability-message" role="status"></div>
      <form class="row g-3 mt-1 d-none" id="public-availability-form">
        <div class="col-md-4"><label class="form-label" for="availability-date">日期</label><input class="form-control" id="availability-date" type="date" required></div>
        <div class="col-md-4"><label class="form-label" for="availability-timezone">所在時區</label><input class="form-control" id="availability-timezone" list="timezone-list" value="Asia/Taipei" required></div>
        <div class="col-md-4"><label class="form-label" for="availability-location">所在城市／地點</label><input class="form-control" id="availability-location" value="台灣｜台北／新北／桃園" required></div>
        <div class="col-12"><p class="form-label mb-2">可面試時間（每格 30 分鐘）</p><div class="time-slot-grid" id="availability-times"></div></div>
        <div class="col-12 d-flex justify-content-end"><button class="btn btn-primary px-4" type="submit">儲存這一天的空檔</button></div>
      </form>
    </section>
  </main>
  <datalist id="timezone-list"><option value="Asia/Taipei"><option value="Asia/Tokyo"><option value="Asia/Shanghai"><option value="Asia/Singapore"><option value="Europe/London"><option value="Europe/Berlin"><option value="America/New_York"><option value="America/Chicago"><option value="America/Los_Angeles"><option value="Australia/Sydney"><option value="UTC"></datalist>
  <script src="../js/availability-public.js?v=63"></script>
</body>
</html>
