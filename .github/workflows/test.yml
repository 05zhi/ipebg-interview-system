name: Test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: interview_system_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d interview_system_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_TEST: postgresql://postgres:postgres@localhost:5432/interview_system_test?sslmode=disable
      DATABASE_URL_DIRECT: postgresql://production:production@production.invalid/neondb?sslmode=require
      JWT_SECRET: github-actions-test-secret-at-least-32-characters
      CORS_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm test
